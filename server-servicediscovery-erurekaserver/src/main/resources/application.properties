spring.application.name=server-servicediscovery-erurekaserver
#Without adding below enteries server will not start since it is continuously searching for other eureka server
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

#by default eureka server running at localhost:8080 but its client searching at 8761 so changed here
eureka.client.service-url.http://localhost:8761/eureka/
server.port=8761